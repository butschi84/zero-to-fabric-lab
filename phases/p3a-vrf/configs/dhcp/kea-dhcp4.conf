{
  "Dhcp4": {
    "interfaces-config": { "interfaces": [ "eth1" ], "dhcp-socket-type": "udp" },
    "lease-database": { "type": "memfile", "persist": false },
    "valid-lifetime": 3600,
    // corp network 01. Requests arrive relayed with giaddr = the leaf's unique
    // 10.1.255.<id>, which is not inside 10.1.1.0/24. SR Linux 24.10 sends no
    // link-selection (RFC 3527), so the subnet is chosen by relay address.
    "subnet4": [ {
      "id": 101, "subnet": "10.1.1.0/24",
      "pools": [ { "pool": "10.1.1.100 - 10.1.1.149" } ],
      "relay": { "ip-addresses": [ "10.1.255.11", "10.1.255.12", "10.1.255.13" ] },
      "option-data": [ { "name": "routers", "data": "10.1.1.1" } ]
    } ],
    "loggers": [ { "name": "kea-dhcp4", "output-options": [ { "output": "stdout" } ], "severity": "INFO" } ]
  }
}
