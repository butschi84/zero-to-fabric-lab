! srv1: web server that announces the anycast VIP 10.9.100.10/32 to its leaf
! (VRF shared, leaf AS 65102). Withdrawing the route takes the server out.
frr defaults datacenter
hostname srv1
log stdout informational
ip prefix-list VIP seq 10 permit 10.9.100.10/32
route-map ANNOUNCE permit 10
 match ip address prefix-list VIP
router bgp 65411
 bgp router-id 10.9.1.11
 no bgp ebgp-requires-policy
 neighbor 10.9.1.1 remote-as 65102
 neighbor 10.9.1.1 description leaf anycast gateway
 address-family ipv4 unicast
  network 10.9.100.10/32
  neighbor 10.9.1.1 route-map ANNOUNCE out
 exit-address-family
