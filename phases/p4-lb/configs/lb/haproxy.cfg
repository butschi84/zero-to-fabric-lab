# Balancer in the service rack (VRF shared): VIP 10.9.1.100:80 -> three web servers.
global
  log stdout format raw local0
defaults
  mode http
  timeout connect 1s
  timeout client 5s
  timeout server 5s
frontend web
  bind 10.9.1.100:80
  default_backend servers
backend servers
  balance roundrobin
  option httpchk GET /
  default-server inter 1s fall 2 rise 2
  server srv1 10.9.1.11:80 check
  server srv2 10.9.1.12:80 check
  server srv3 10.9.1.13:80 check
listen stats
  bind 0.0.0.0:8404
  stats enable
  stats uri /stats
  stats refresh 5s
