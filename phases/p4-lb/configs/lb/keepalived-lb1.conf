# lb1: VRRP for the balancer VIP 10.9.1.100 (VLAN 901, stretched over leaf2 and
# leaf3 by EVPN, so the VRRP multicast travels as BUM via ingress replication).
global_defs {
  router_id lb1
}
vrrp_instance LB {
  state MASTER
  interface eth1
  virtual_router_id 100
  priority 150
  advert_int 1
  virtual_ipaddress {
    10.9.1.100/24 dev eth1
  }
}
