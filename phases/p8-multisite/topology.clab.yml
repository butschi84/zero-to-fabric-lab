# Phase 8 - two sites and a branch, joined over WANs (configs: tools/gen_p8.py).
# Site A (spine-a, leaf-a1, gw-a, gw-a2) and site B (spine-b, leaf-b1, gw-b,
# gw-b2) are separate small fabrics with their own overlay AS (65500 / 65510),
# two border gateways each. The gateways peer across the WAN "wan" (a Linux
# bridge standing for the carrier network; impairment with `containerlab tools
# netem`): underlay eBGP for the loopbacks, DCI variant B = eBGP-EVPN with the
# next hop unchanged (VXLAN runs leaf to leaf). corp network 01 (VLAN 101) is
# stretched over both sites, 02 exists only in A, 03 only in B, guest 01 only
# in A. srv-a / srv-b announce the same anycast VIP 10.9.100.10 (A preferred).
# Branch: br1 (SR Linux, VRFs corp and guest, overlay AS 65520) behind
# ipsec-br (strongSwan + FRR). Two independent WAN paths: wan1 (ISP 1) to the
# IPsec concentrator ipsec-a in site A (primary), wan2 (ISP 2) to ipsec-b in
# site B (backup). The VRFs ride as L3VNIs over the tunnels (EVPN Type 5).
name: ztf-p8

mgmt:
  network: ztf-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:24.10.7
      type: ixr-d2l
    linux:
      image: ztf-tools:1
  nodes:
    spine-a: {kind: nokia_srlinux, startup-config: configs/spine-a.cli, mgmt-ipv4: 172.30.30.11, labels: {graph-level: 2, graph-icon: switch}}
    leaf-a1: {kind: nokia_srlinux, startup-config: configs/leaf-a1.cli, mgmt-ipv4: 172.30.30.21, labels: {graph-level: 3, graph-icon: switch}}
    gw-a: {kind: nokia_srlinux, startup-config: configs/gw-a.cli, mgmt-ipv4: 172.30.30.31, labels: {graph-level: 1, graph-icon: switch}}
    gw-a2: {kind: nokia_srlinux, startup-config: configs/gw-a2.cli, mgmt-ipv4: 172.30.30.33, labels: {graph-level: 1, graph-icon: switch}}
    spine-b: {kind: nokia_srlinux, startup-config: configs/spine-b.cli, mgmt-ipv4: 172.30.30.12, labels: {graph-level: 2, graph-icon: switch}}
    leaf-b1: {kind: nokia_srlinux, startup-config: configs/leaf-b1.cli, mgmt-ipv4: 172.30.30.22, labels: {graph-level: 3, graph-icon: switch}}
    gw-b: {kind: nokia_srlinux, startup-config: configs/gw-b.cli, mgmt-ipv4: 172.30.30.32, labels: {graph-level: 1, graph-icon: switch}}
    gw-b2: {kind: nokia_srlinux, startup-config: configs/gw-b2.cli, mgmt-ipv4: 172.30.30.34, labels: {graph-level: 1, graph-icon: switch}}
    br1: {kind: nokia_srlinux, startup-config: configs/br1.cli, mgmt-ipv4: 172.30.30.25, labels: {graph-level: 3, graph-icon: switch}}
    wan:
      kind: linux
      mgmt-ipv4: 172.30.30.40
      labels: {graph-level: 0, graph-icon: router}
      exec: ["ip link add br0 type bridge", "ip link set eth1 master br0", "ip link set eth2 master br0", "ip link set eth3 master br0", "ip link set eth4 master br0", "ip link set br0 up"]
    wan1:
      kind: linux
      mgmt-ipv4: 172.30.30.41
      labels: {graph-level: 0, graph-icon: router}
      exec: ["ip link add br0 type bridge", "ip link set eth1 master br0", "ip link set eth2 master br0", "ip link set br0 up"]
    wan2:
      kind: linux
      mgmt-ipv4: 172.30.30.42
      labels: {graph-level: 0, graph-icon: router}
      exec: ["ip link add br0 type bridge", "ip link set eth1 master br0", "ip link set eth2 master br0", "ip link set br0 up"]
    ipsec-a:
      kind: linux
      image: ztf-frr:1
      mgmt-ipv4: 172.30.30.43
      labels: {graph-level: 1, graph-icon: router}
      binds: ["configs/frr/daemons:/etc/frr/daemons", "configs/frr/ipsec-a.conf:/etc/frr/frr.conf", "configs/frr/vtysh.conf:/etc/frr/vtysh.conf",
              "configs/ipsec/strongswan.conf:/etc/strongswan.conf:ro", "configs/ipsec/ipsec-a.swanctl.conf:/etc/swanctl/swanctl.conf:ro", "configs/ipsec/ipsec-init.sh:/ipsec-init.sh:ro",
              "configs/ipsec/ipsec-a-init.sh:/box-init.sh:ro"]
      exec: ["/box-init.sh"]
    ipsec-b:
      kind: linux
      image: ztf-frr:1
      mgmt-ipv4: 172.30.30.44
      labels: {graph-level: 1, graph-icon: router}
      binds: ["configs/frr/daemons:/etc/frr/daemons", "configs/frr/ipsec-b.conf:/etc/frr/frr.conf", "configs/frr/vtysh.conf:/etc/frr/vtysh.conf",
              "configs/ipsec/strongswan.conf:/etc/strongswan.conf:ro", "configs/ipsec/ipsec-b.swanctl.conf:/etc/swanctl/swanctl.conf:ro", "configs/ipsec/ipsec-init.sh:/ipsec-init.sh:ro",
              "configs/ipsec/ipsec-b-init.sh:/box-init.sh:ro"]
      exec: ["/box-init.sh"]
    ipsec-br:
      kind: linux
      image: ztf-frr:1
      mgmt-ipv4: 172.30.30.45
      labels: {graph-level: 2, graph-icon: router}
      binds: ["configs/frr/daemons:/etc/frr/daemons", "configs/frr/ipsec-br.conf:/etc/frr/frr.conf", "configs/frr/vtysh.conf:/etc/frr/vtysh.conf",
              "configs/ipsec/strongswan.conf:/etc/strongswan.conf:ro", "configs/ipsec/ipsec-br.swanctl.conf:/etc/swanctl/swanctl.conf:ro", "configs/ipsec/ipsec-init.sh:/ipsec-init.sh:ro",
              "configs/ipsec/ipsec-br-init.sh:/box-init.sh:ro"]
      exec: ["/box-init.sh"]
    srv-a:
      kind: linux
      image: ztf-frr:1
      mgmt-ipv4: 172.30.30.111
      labels: {graph-level: 4, graph-icon: server}
      binds: ["configs/frr/daemons:/etc/frr/daemons", "configs/frr/srv-a.conf:/etc/frr/frr.conf", "configs/frr/vtysh.conf:/etc/frr/vtysh.conf", "configs/web-init.sh:/web-init.sh:ro"]
      exec: ["ip link set eth1 address 02:00:00:0a:02:20", "ip link set eth1 mtu 1500", "ip addr add 10.1.2.20/24 dev eth1", "ip route del default", "ip route add default via 10.1.2.1",
             "ip addr add 10.9.100.10/32 dev lo", "/web-init.sh", "iperf3 -s -D"]
    srv-b:
      kind: linux
      image: ztf-frr:1
      mgmt-ipv4: 172.30.30.112
      labels: {graph-level: 4, graph-icon: server}
      binds: ["configs/frr/daemons:/etc/frr/daemons", "configs/frr/srv-b.conf:/etc/frr/frr.conf", "configs/frr/vtysh.conf:/etc/frr/vtysh.conf", "configs/web-init.sh:/web-init.sh:ro"]
      exec: ["ip link set eth1 address 02:00:00:0b:03:20", "ip link set eth1 mtu 1500", "ip addr add 10.1.3.20/24 dev eth1", "ip route del default", "ip route add default via 10.1.3.1",
             "ip addr add 10.9.100.10/32 dev lo", "/web-init.sh", "iperf3 -s -D"]
    a-c1: {kind: linux, mgmt-ipv4: 172.30.30.101, labels: {graph-level: 4, graph-icon: host},
           exec: ["ip link set eth1 address 02:00:00:0a:01:11", "ip link set eth1 mtu 1500", "ip addr add 10.1.1.11/24 dev eth1", "ip route replace default via 10.1.1.1"]}
    a-c2: {kind: linux, mgmt-ipv4: 172.30.30.102, labels: {graph-level: 4, graph-icon: host},
           exec: ["ip link set eth1 address 02:00:00:0a:02:11", "ip link set eth1 mtu 1500", "ip addr add 10.1.2.11/24 dev eth1", "ip route replace default via 10.1.2.1"]}
    a-g1: {kind: linux, mgmt-ipv4: 172.30.30.105, labels: {graph-level: 4, graph-icon: host},
           exec: ["ip link set eth1 address 02:00:00:0a:21:11", "ip link set eth1 mtu 1500", "ip addr add 10.2.1.11/24 dev eth1", "ip route replace default via 10.2.1.1"]}
    b-c1: {kind: linux, mgmt-ipv4: 172.30.30.103, labels: {graph-level: 4, graph-icon: host},
           exec: ["ip link set eth1 address 02:00:00:0b:01:21", "ip link set eth1 mtu 1500", "ip addr add 10.1.1.21/24 dev eth1", "ip route replace default via 10.1.1.1"]}
    b-c3: {kind: linux, mgmt-ipv4: 172.30.30.104, labels: {graph-level: 4, graph-icon: host},
           exec: ["ip link set eth1 address 02:00:00:0b:03:21", "ip link set eth1 mtu 1500", "ip addr add 10.1.3.21/24 dev eth1", "ip route replace default via 10.1.3.1"]}
    br-c1: {kind: linux, mgmt-ipv4: 172.30.30.106, labels: {graph-level: 4, graph-icon: host},
            exec: ["ip link set eth1 address 02:00:00:0c:01:11", "ip link set eth1 mtu 1500", "ip addr add 10.1.10.11/24 dev eth1", "ip route replace default via 10.1.10.1"]}
    br-g1: {kind: linux, mgmt-ipv4: 172.30.30.107, labels: {graph-level: 4, graph-icon: host},
            exec: ["ip link set eth1 address 02:00:00:0c:21:11", "ip link set eth1 mtu 1500", "ip addr add 10.2.10.11/24 dev eth1", "ip route replace default via 10.2.10.1"]}
  links:
    - endpoints: ["leaf-a1:e1-49", "spine-a:e1-1"]
    - endpoints: ["gw-a:e1-49", "spine-a:e1-7"]
    - endpoints: ["gw-a2:e1-49", "spine-a:e1-8"]
    - endpoints: ["leaf-b1:e1-49", "spine-b:e1-1"]
    - endpoints: ["gw-b:e1-49", "spine-b:e1-7"]
    - endpoints: ["gw-b2:e1-49", "spine-b:e1-8"]
    - endpoints: ["gw-a:e1-1", "wan:eth1"]
    - endpoints: ["gw-b:e1-1", "wan:eth2"]
    - endpoints: ["gw-a2:e1-1", "wan:eth3"]
    - endpoints: ["gw-b2:e1-1", "wan:eth4"]
    - endpoints: ["gw-a:e1-2", "ipsec-a:eth1"]
    - endpoints: ["gw-a2:e1-2", "ipsec-a:eth3"]
    - endpoints: ["gw-b:e1-2", "ipsec-b:eth1"]
    - endpoints: ["gw-b2:e1-2", "ipsec-b:eth3"]
    - endpoints: ["ipsec-a:eth2", "wan1:eth1"]
    - endpoints: ["ipsec-br:eth2", "wan1:eth2"]
    - endpoints: ["ipsec-b:eth2", "wan2:eth1"]
    - endpoints: ["ipsec-br:eth3", "wan2:eth2"]
    - endpoints: ["br1:e1-49", "ipsec-br:eth1"]
    - endpoints: ["a-c1:eth1", "leaf-a1:e1-1"]
    - endpoints: ["a-c2:eth1", "leaf-a1:e1-2"]
    - endpoints: ["a-g1:eth1", "leaf-a1:e1-3"]
    - endpoints: ["srv-a:eth1", "leaf-a1:e1-4"]
    - endpoints: ["b-c1:eth1", "leaf-b1:e1-1"]
    - endpoints: ["b-c3:eth1", "leaf-b1:e1-2"]
    - endpoints: ["srv-b:eth1", "leaf-b1:e1-3"]
    - endpoints: ["br-c1:eth1", "br1:e1-1"]
    - endpoints: ["br-g1:eth1", "br1:e1-2"]
