! srv-a: web server in site A that announces the anycast VIP 10.9.100.10/32 to its leaf
! (VRF corp, leaf AS 65101). Site B's copy is prepended: A serves while it is up.
frr defaults datacenter
hostname srv-a
log stdout informational
ip prefix-list VIP seq 10 permit 10.9.100.10/32
route-map ANNOUNCE permit 10
 match ip address prefix-list VIP
router bgp 65411
 bgp router-id 10.1.2.20
 no bgp ebgp-requires-policy
 neighbor 10.1.2.1 remote-as 65101
 neighbor 10.1.2.1 description leaf anycast gateway
 address-family ipv4 unicast
  network 10.9.100.10/32
  neighbor 10.1.2.1 route-map ANNOUNCE out
 exit-address-family
exit
