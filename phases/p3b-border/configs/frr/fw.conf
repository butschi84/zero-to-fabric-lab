! Firewall (stateful, iptables) with FRR, AS 65300. One tagged sub-interface
! per tenant towards each border leaf (VLAN = tenant number). It passes the
! default route it learns from the WAN router to every tenant VRF, and only
! that: the default disappears from the fabric when the WAN is gone. No NAT.
frr defaults datacenter
hostname fw
log stdout informational
ip prefix-list DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list TENANTS seq 10 permit 10.0.0.0/8 ge 16 le 32
route-map TO-TENANT permit 10
 match ip address prefix-list DEFAULT
route-map FROM-TENANT permit 10
 match ip address prefix-list TENANTS
route-map TO-WAN permit 10
 match ip address prefix-list TENANTS
route-map FROM-WAN permit 10
 match ip address prefix-list DEFAULT
router bgp 65300
 bgp router-id 10.250.0.1
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor WAN peer-group
 neighbor WAN remote-as 64900
 neighbor TENANT peer-group
 neighbor TENANT remote-as external
 neighbor 10.250.0.0 peer-group WAN
 neighbor 10.250.1.2 peer-group TENANT
 neighbor 10.250.1.4 peer-group TENANT
 neighbor 10.250.1.6 peer-group TENANT
 neighbor 10.250.1.18 peer-group TENANT
 neighbor 10.250.2.2 peer-group TENANT
 neighbor 10.250.2.4 peer-group TENANT
 neighbor 10.250.2.6 peer-group TENANT
 neighbor 10.250.2.18 peer-group TENANT
 address-family ipv4 unicast
  maximum-paths 8
  neighbor WAN route-map FROM-WAN in
  neighbor WAN route-map TO-WAN out
  neighbor TENANT route-map FROM-TENANT in
  neighbor TENANT route-map TO-TENANT out
 exit-address-family
