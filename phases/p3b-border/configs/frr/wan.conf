! WAN / internet edge, AS 64900. Sends a default route to the firewall and
! stands in for "the internet" with 198.51.100.1 (documentation prefix).
frr defaults datacenter
hostname wan
log stdout informational
router bgp 64900
 bgp router-id 10.250.0.0
 no bgp ebgp-requires-policy
 neighbor 10.250.0.1 remote-as 65300
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 10.250.0.1 default-originate
 exit-address-family
ip route 198.51.100.0/24 Null0
