! ce-a: customer A's own router (AS 64611), eBGP to leaf2 in VRF cust-a.
! Announces the customer's office networks; P5-07 adds ten more prefixes to
! hit the leaf's prefix limit (5).
frr defaults datacenter
hostname ce-a
log stdout informational
ip route 192.168.10.0/24 Null0
ip route 192.168.11.0/24 Null0
router bgp 64611
 bgp router-id 10.11.254.1
 no bgp ebgp-requires-policy
 neighbor 10.11.254.0 remote-as 65102
 neighbor 10.11.254.0 description leaf2 VRF cust-a
 address-family ipv4 unicast
  network 192.168.10.0/24
  network 192.168.11.0/24
 exit-address-family
