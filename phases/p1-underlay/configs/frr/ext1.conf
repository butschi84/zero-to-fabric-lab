! Test peer ext1 for the BGP deep-dive shots (P1-07..P1-09). Originates the
! documentation prefix 203.0.113.0/24 towards leaf1 only.
frr defaults traditional
hostname ext1
log file /tmp/frr.log informational
log timestamp precision 3
!
interface eth1
 ip address 10.253.1.1/31
!
ip route 203.0.113.0/24 blackhole
!
route-map OUT permit 10

!
router bgp 64501
 bgp router-id 10.253.1.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 10.253.1.0 remote-as 65101
 neighbor 10.253.1.0 description leaf1
 neighbor 10.253.1.0 timers 60 180
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.253.1.0 route-map OUT out
 exit-address-family
!
