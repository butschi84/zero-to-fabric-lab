frr defaults datacenter
hostname ipsec-br
log stdout informational
ip prefix-list LOOPS seq 10 permit 10.255.0.0/16 ge 32
ip prefix-list BRANCH seq 10 permit 10.255.2.0/24 ge 32
route-map FROM-WAN1 permit 10
 match ip address prefix-list LOOPS
 set local-preference 200
route-map FROM-WAN2 permit 10
 match ip address prefix-list LOOPS
route-map TO-WAN1 permit 10
 match ip address prefix-list BRANCH
route-map TO-WAN2 permit 10
 match ip address prefix-list BRANCH
 set as-path prepend 65320 65320 65320
route-map LAN permit 10
 match ip address prefix-list LOOPS
router bgp 65320
 bgp router-id 10.254.21.0
 no bgp ebgp-requires-policy
 neighbor 10.254.21.1 remote-as 65120
 neighbor 10.254.21.1 description br1
 neighbor 10.254.21.1 bfd profile lan
 neighbor 10.252.1.1 remote-as 65321
 neighbor 10.252.1.1 description ipsec-a over WAN 1 (vti1)
 neighbor 10.252.1.1 bfd profile tunnel
 neighbor 10.252.2.1 remote-as 65322
 neighbor 10.252.2.1 description ipsec-b over WAN 2 (vti2)
 neighbor 10.252.2.1 bfd profile tunnel
 address-family ipv4 unicast
  neighbor 10.254.21.1 route-map LAN in
  neighbor 10.254.21.1 route-map LAN out
  neighbor 10.252.1.1 route-map FROM-WAN1 in
  neighbor 10.252.1.1 route-map TO-WAN1 out
  neighbor 10.252.2.1 route-map FROM-WAN2 in
  neighbor 10.252.2.1 route-map TO-WAN2 out
 exit-address-family
exit
bfd
 profile lan
  detect-multiplier 3
  receive-interval 1000
  transmit-interval 1000
 exit
 profile tunnel
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
exit
