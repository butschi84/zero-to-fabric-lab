frr defaults datacenter
hostname ipsec-a
log stdout informational
ip prefix-list LOOPS seq 10 permit 10.255.0.0/16 ge 32
ip prefix-list BRANCH seq 10 permit 10.255.2.0/24 ge 32
route-map LOOPS permit 10
 match ip address prefix-list LOOPS
route-map FROM-BRANCH permit 10
 match ip address prefix-list BRANCH
router bgp 65321
 bgp router-id 10.254.1.20
 no bgp ebgp-requires-policy
 neighbor 10.254.1.21 remote-as 65201
 neighbor 10.254.1.21 description gw-a
 neighbor 10.254.1.21 bfd profile lan
 neighbor 10.254.1.23 remote-as 65202
 neighbor 10.254.1.23 description gw-a2
 neighbor 10.254.1.23 bfd profile lan
 neighbor 10.252.1.2 remote-as 65320
 neighbor 10.252.1.2 description ipsec-br (branch)
 neighbor 10.252.1.2 bfd profile tunnel
 address-family ipv4 unicast
  neighbor 10.254.1.21 route-map LOOPS in
  neighbor 10.254.1.21 route-map LOOPS out
  neighbor 10.254.1.23 route-map LOOPS in
  neighbor 10.254.1.23 route-map LOOPS out
  neighbor 10.252.1.2 route-map FROM-BRANCH in
  neighbor 10.252.1.2 route-map LOOPS out
 exit-address-family
exit
bfd
 profile lan
  detect-multiplier 3
  receive-interval 1000
  transmit-interval 1000
 exit
 profile tunnel
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
exit
