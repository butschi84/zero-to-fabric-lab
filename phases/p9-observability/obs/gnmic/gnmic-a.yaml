# gnmic for site A: subscribes to the SR Linux nodes of the site over the
# out-of-band management network and sends OTLP/gRPC to the site's collector.
# Generated by obs/gen_gnmic.py; the same paths on every site.
username: admin
password: NokiaSrl1!
skip-verify: true
encoding: json_ietf
targets:
  spine-a:
    address: 172.30.30.11:57400
  leaf-a1:
    address: 172.30.30.21:57400
  gw-a:
    address: 172.30.30.31:57400
  gw-a2:
    address: 172.30.30.33:57400
  br1:
    address: 172.30.30.25:57400
subscriptions:
  interfaces:
    paths:
      - /interface[name=ethernet-1/*]/oper-state
      - /interface[name=ethernet-1/*]/admin-state
      - /interface[name=ethernet-1/*]/statistics/in-octets
      - /interface[name=ethernet-1/*]/statistics/out-octets
      - /interface[name=ethernet-1/*]/statistics/in-error-packets
      - /interface[name=ethernet-1/*]/statistics/out-error-packets
      - /interface[name=ethernet-1/*]/statistics/in-discarded-packets
      - /interface[name=ethernet-1/*]/statistics/out-discarded-packets
    mode: stream
    stream-mode: sample
    sample-interval: 5s
  bgp:
    paths:
      - /network-instance[name=*]/protocols/bgp/neighbor[peer-address=*]/session-state
      - /network-instance[name=*]/protocols/bgp/neighbor[peer-address=*]/afi-safi[afi-safi-name=*]/received-routes
      - /network-instance[name=*]/protocols/bgp/neighbor[peer-address=*]/afi-safi[afi-safi-name=*]/active-routes
    mode: stream
    stream-mode: sample
    sample-interval: 5s
  bfd:
    paths:
      - /bfd/network-instance[name=*]/peer[local-discriminator=*]/session-state
      - /bfd/network-instance[name=*]/peer[local-discriminator=*]/remote-address
    mode: stream
    stream-mode: sample
    sample-interval: 5s
  evpn:
    paths:
      - /network-instance[name=default]/bgp-rib/afi-safi[afi-safi-name=evpn]/evpn/rib-in-out/rib-in-post/mac-ip-route/used-route
      - /network-instance[name=default]/bgp-rib/afi-safi[afi-safi-name=evpn]/evpn/rib-in-out/rib-in-post/imet-route/used-route
      - /network-instance[name=default]/bgp-rib/afi-safi[afi-safi-name=evpn]/evpn/rib-in-out/rib-in-post/ip-prefix-route/used-route
      - /network-instance[name=default]/bgp-rib/afi-safi[afi-safi-name=evpn]/evpn/rib-in-out/rib-in-post/ethernet-ad-route/used-route
      - /network-instance[name=default]/bgp-rib/afi-safi[afi-safi-name=evpn]/evpn/rib-in-out/rib-in-post/ethernet-segment-route/used-route
      - /tunnel/vxlan-tunnel/vtep[address=*]/index
    mode: stream
    stream-mode: sample
    sample-interval: 15s
  l2:
    paths:
      - /network-instance[name=*]/bridge-table/statistics
    mode: stream
    stream-mode: sample
    sample-interval: 5s
  vrf:
    paths:
      - /network-instance[name=*]/route-table/ipv4-unicast/statistics/active-routes
    mode: stream
    stream-mode: sample
    sample-interval: 10s
processors:
  # readable names: drop the YANG module prefixes (srl_nokia-interfaces:interface -> interface)
  strip-modules:
    event-strings:
      value-names: [".*"]
      tag-names: [".*"]
      transforms:
        - replace: {apply-on: name, old: "srl_nokia-[a-z0-9-]+:", new: ""}
  # numbers for Prometheus: up / established / true = 1, any other state = 0
  state-to-number:
    event-strings:
      value-names: ["session-state$", "oper-state$", "admin-state$", "used-route$"]
      transforms:
        - replace: {apply-on: value, old: "^(?i)(up|established|true|enable)$", new: "1"}
        - replace: {apply-on: value, old: "^[A-Za-z-]+$", new: "0"}
  # text values are not metrics (they stay as labels where gnmic made them keys)
  drop-text:
    event-delete:
      value-names: ["remote-address$", "/type$", "/name$", "last-change$", "last-clear$"]
  # JSON IETF sends 64-bit counters as strings
  to-number:
    event-convert:
      value-names: [".*"]
      type: float
outputs:
  collector:
    type: otlp
    endpoint: 172.30.30.201:4317
    protocol: grpc
    metric-prefix: srl
    append-subscription-name: false
    strip-leading-underscore: true
    resource-tag-keys: [source]
    resource-attributes:
      service.name: gnmic
      site: "a"
    counter-patterns: ["octets$", "packets$"]
    event-processors: [strip-modules, state-to-number, drop-text, to-number]
