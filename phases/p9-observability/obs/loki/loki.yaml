# Loki for phase 9: syslog from the SR Linux nodes arrives as OTLP logs from the
# site collectors (/otlp). Single binary, filesystem storage, no auth.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /tmp/loki
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}
  storage:
    filesystem: {chunks_directory: /tmp/loki/chunks, rules_directory: /tmp/loki/rules}
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}
limits_config:
  allow_structured_metadata: true
  reject_old_samples: false
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [host.name, site, collector.site]
analytics:
  reporting_enabled: false
